services:
  postgres:
    image: postgres:15-alpine
    container_name: skolr_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skolr_auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skolr_network
  auth-service:
    build:
      context: ./packages/auth-service
      dockerfile: Dockerfile.dev
    container_name: skolr_auth_service
    ports:
      - "3000:3000"
    environment:
      - JWT_SECRET=your_secure_jwt_secret_here
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/skolr_auth?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skolr_network
volumes:
  postgres_data:

networks:
  skolr_network:
    driver: bridge
