services:
  postgres:
    image: postgres:15-alpine
    container_name: skolr_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skolr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skolr_network
  backend:
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile
    container_name: skolr_backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=your_secure_jwt_secret_here
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/skolr?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skolr_network
volumes:
  postgres_data:

networks:
  skolr_network:
    driver: bridge
