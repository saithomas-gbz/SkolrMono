global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          db: 'skolr'

  # Métriques applicatives du monolithe (#218). Port dédié, jamais publié sur
  # l'hôte : voir packages/backend/src/shared/metrics.ts. Le port est figé ici ;
  # si `METRICS_PORT` change, cette cible doit changer avec lui.
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:9464']
