global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'postgres-auth'
    static_configs:
      - targets: ['postgres-exporter-auth:9187']
        labels:
          db: 'auth'

  - job_name: 'postgres-class'
    static_configs:
      - targets: ['postgres-exporter-class:9187']
        labels:
          db: 'class'

  - job_name: 'postgres-grade'
    static_configs:
      - targets: ['postgres-exporter-grade:9187']
        labels:
          db: 'grade'

  - job_name: 'postgres-planning'
    static_configs:
      - targets: ['postgres-exporter-planning:9187']
        labels:
          db: 'planning'
