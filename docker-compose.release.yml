# Tire les images publiées depuis GHCR (tag piloté par SKOLR_VERSION, défaut: latest) :
#   SKOLR_VERSION=1.0.0 docker compose -f docker-compose.release.yml up -d
services:
  postgres:
    image: postgres:15-alpine
    container_name: skolr_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skolr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skolr_network

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skolr_network

  backend:
    image: ghcr.io/saithomas-gbz/skolr-backend:${SKOLR_VERSION:-latest}
    container_name: skolr_backend
    environment:
      - PORT=${BACKEND_PORT:-3001}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-skolr}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your_secure_jwt_secret_here}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-skolr-messages}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:${BACKEND_PORT:-3001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - skolr_network

  frontend:
    image: ghcr.io/saithomas-gbz/skolr-frontend:${SKOLR_VERSION:-latest}
    container_name: skolr_frontend
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_GATEWAY_BASE_URL=${NUXT_PUBLIC_GATEWAY_BASE_URL:-/api}
      - NUXT_PUBLIC_GATEWAY_WS_BASE_URL=${NUXT_PUBLIC_GATEWAY_WS_BASE_URL:-ws://localhost:${BACKEND_PORT:-3001}}
      - NUXT_PUBLIC_GATEWAY_DIRECT_URL=${NUXT_PUBLIC_GATEWAY_DIRECT_URL:-http://localhost:${BACKEND_PORT:-3001}}
      - GATEWAY_INTERNAL_URL=${GATEWAY_INTERNAL_URL:-http://backend:3001}
      # Nuxt ne surcharge une clé privée de runtimeConfig au runtime que via le préfixe NUXT_.
      # Sans ça, le proxy garde la valeur figée au build (localhost:3001) -> 502 (#175).
      - NUXT_GATEWAY_INTERNAL_URL=${GATEWAY_INTERNAL_URL:-http://backend:3001}
      - NUXT_PUBLIC_SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    ports:
      - "${FRONTEND_PORT:-3003}:3003"
    depends_on:
      - backend
    networks:
      - skolr_network

volumes:
  postgres_data:
  minio_data:

networks:
  skolr_network:
    name: skolr_network
    driver: bridge
