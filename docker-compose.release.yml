# Tire les images publiées depuis GHCR (tag piloté par SKOLR_VERSION, défaut: latest) :
#   SKOLR_VERSION=1.0.0 docker compose -f docker-compose.release.yml up -d
#
# Cette stack est celle qui tourne en production : les cinq secrets
# (POSTGRES_PASSWORD, JWT_SECRET, MINIO_ROOT_PASSWORD, S3_SECRET_ACCESS_KEY,
# BACKUP_ENCRYPTION_KEY) n'ont volontairement pas de valeur par défaut. La
# substitution `${VAR:?...}` interrompt le démarrage avec un message explicite
# si l'un d'eux manque, plutôt que de laisser démarrer une prod avec un secret
# connu du dépôt.
services:
  postgres:
    image: postgres:18-alpine
    container_name: skolr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-skolr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skolr_network

  # Sauvegardes chiffrées de la base (#194). Image Debian et non -alpine :
  # les scripts chiffrent avec `openssl enc`, absent de postgres:15-alpine.
  # Les archives sont écrites dans le volume `backup_data`, qui vit sur le même
  # hôte que `postgres_data` : la copie hors site est une étape à part entière
  # du runbook, voir docs/ops/backup-restore.md.
  db-backup:
    image: postgres:18
    container_name: skolr_db_backup
    restart: unless-stopped
    entrypoint: ["/opt/backup/backup-loop.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env.example)}
      PGDATABASE: ${POSTGRES_DB:-skolr}
      BACKUP_DIR: /backups
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY est requis (voir .env.example)}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./scripts/backup:/opt/backup:ro
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skolr_network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD est requis (voir .env.example)}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - skolr_network

  backend:
    image: ghcr.io/saithomas-gbz/skolr-backend:${SKOLR_VERSION:-latest}
    container_name: skolr_backend
    restart: unless-stopped
    environment:
      - PORT=${BACKEND_PORT:-3001}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env.example)}@postgres:5432/${POSTGRES_DB:-skolr}?schema=public
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET est requis (voir .env.example)}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-skolr-messages}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY est requis (voir .env.example)}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      # Métriques Prometheus sur un port dédié, volontairement absent de `ports:`
      # ci-dessous : joignable depuis skolr_network (Prometheus), jamais depuis
      # l'hôte. `0.0.0.0` traverse le namespace réseau du conteneur ; le défaut
      # du code reste `127.0.0.1` (#218).
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_HOST=0.0.0.0
      - METRICS_PORT=${METRICS_PORT:-9464}
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:${BACKEND_PORT:-3001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - skolr_network

  frontend:
    image: ghcr.io/saithomas-gbz/skolr-frontend:${SKOLR_VERSION:-latest}
    container_name: skolr_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NUXT_PUBLIC_GATEWAY_BASE_URL=${NUXT_PUBLIC_GATEWAY_BASE_URL:-/api}
      - NUXT_PUBLIC_GATEWAY_WS_BASE_URL=${NUXT_PUBLIC_GATEWAY_WS_BASE_URL:-ws://localhost:${BACKEND_PORT:-3001}}
      - NUXT_PUBLIC_GATEWAY_DIRECT_URL=${NUXT_PUBLIC_GATEWAY_DIRECT_URL:-http://localhost:${BACKEND_PORT:-3001}}
      - GATEWAY_INTERNAL_URL=${GATEWAY_INTERNAL_URL:-http://backend:3001}
      # Nuxt ne surcharge une clé privée de runtimeConfig au runtime que via le préfixe NUXT_.
      # Sans ça, le proxy garde la valeur figée au build (localhost:3001) -> 502 (#175).
      - NUXT_GATEWAY_INTERNAL_URL=${GATEWAY_INTERNAL_URL:-http://backend:3001}
      - NUXT_PUBLIC_SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
    ports:
      - "${FRONTEND_PORT:-3003}:3003"
    depends_on:
      - backend
    # Même motif que le backend : l'image de production est basée sur oven/bun,
    # `bun` est donc disponible dans le conteneur (ni curl ni wget ne le sont).
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3003/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - skolr_network

  # --- Supervision (#218) ---
  # Prometheus collecte, Grafana affiche, les exporters mesurent ce que
  # l'application ne mesure pas elle-même (hôte, base). Sentry reste
  # complémentaire : il porte la trace d'une erreur, Prometheus en porte le
  # volume et la tendance.
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    restart: unless-stopped
    # Prometheus n'a aucune authentification : le publier largement exposerait
    # l'intégralité des métriques et permettrait de piloter l'API d'admin.
    # Lié à la boucle locale — on y accède par tunnel SSH, pas depuis Internet.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    depends_on:
      - backend
    networks:
      - skolr_network

  grafana:
    image: grafana/grafana:13.1.3
    container_name: skolr_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      # Seule interface de supervision réellement publiée : un mot de passe par
      # défaut y donnerait accès à toutes les métriques de production. Même
      # parti que les autres secrets de cette stack (#215).
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD est requis (voir .env.example)}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - skolr_network

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Lecture seule des métriques déposées par pg-backup.sh : c'est ce qui
      # permet d'alerter quand les sauvegardes ont cessé de tourner (#194).
      - backup_data:/backups:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.textfile.directory=/backups/metrics'
    networks:
      - skolr_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est requis (voir .env.example)}@postgres:5432/${POSTGRES_DB:-skolr}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skolr_network

volumes:
  postgres_data:
  minio_data:
  backup_data:
  prometheus_data:
  grafana_data:

networks:
  skolr_network:
    name: skolr_network
    driver: bridge
