name: Test

on:
  push:
    branches: [ main, ci/cd ]
  pull_request:
    branches: [ main, ci/cd ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./packages/${{ matrix.service }}
        run: npm ci
      - name: Run tests
        working-directory: ./packages/${{ matrix.service }}
        run: npm test