name: Clean Dependencies

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  knip:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      run: bun install

    - name: Run Knip
      run: bunx knip

    - name: Run Lint
      run: bun lint
