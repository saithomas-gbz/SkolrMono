name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'packages/frontend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'packages/frontend/**'
    changes:
      - 'packages/frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install

    - name: Unit tests
      working-directory: packages/frontend
      run: bun run test

    - name: Check i18n keys
      working-directory: packages/frontend
      run: bun run i18n:check

    - name: Build frontend
      working-directory: packages/frontend
      run: bun run build

    - name: Build Docker image
      working-directory: packages/frontend
      run: docker build -f Dockerfile -t frontend-skolr .