name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr:
    # Les PR de Dependabot n'ont pas de corps normalise (ni issue liee) :
    # sans cette garde, chacune echouerait sur les trois controles ci-dessous.
    #
    # On teste l'AUTEUR de la PR, pas github.actor : ce dernier designe qui a
    # declenche l'evenement. Des qu'un humain touche une PR Dependabot (mise a
    # jour de la branche, relance, edition du titre), github.actor devient son
    # login, la garde tombe et les controles echouent sur une PR qui n'aurait
    # jamais du y etre soumise. L'auteur, lui, reste dependabot[bot].
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check for linked issue
        if: "!contains(github.event.pull_request.body, 'fixes #') && !contains(github.event.pull_request.body, 'closes #') && !contains(github.event.pull_request.body, 'resolves #')"
        run: |
          echo "::error::PR must be linked to an issue using 'fixes #', 'closes #', or 'resolves #'"
          exit 1

      - name: Check for Description section
        if: "!contains(github.event.pull_request.body, '## Description')"
        run: |
          echo "::error::PR must include a '## Description' section"
          exit 1

      - name: Check for Testing section
        if: "!contains(github.event.pull_request.body, '## Testing')"
        run: |
          echo "::error::PR must include a '## Testing' section"
          exit 1
