name: Class Service CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'packages/class-service/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'packages/class-service/**'
    changes:
      - 'packages/class-service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install

    - name: Generate Prisma client
      working-directory: packages/class-service
      run: bunx prisma generate && ls src/generated/prisma/internal

    - name: Build class-service
      working-directory: packages/class-service
      run: bun run build

    - name: Test class-service
      working-directory: packages/class-service
      run: bun test src/__tests__
      env:
        NODE_ENV: test

    - name: Build Docker image
      run: docker build -f packages/class-service/Dockerfile -t class-service .
