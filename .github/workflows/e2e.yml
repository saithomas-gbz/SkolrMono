name: E2E

on:
  push:
    branches: [ "main" ]
    paths:
      - 'packages/backend/**'
      - 'packages/frontend/**'
      - 'packages/e2e/**'
      - 'scripts/**'
      - 'docker-compose.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'packages/backend/**'
      - 'packages/frontend/**'
      - 'packages/e2e/**'
      - 'scripts/**'
      - 'docker-compose.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install

    - name: Prepare env
      run: cp .env.example .env

    - name: Start backend stack (postgres + minio + backend)
      run: docker compose up -d --wait postgres minio backend

    - name: Migrate + seed dev data (single multi-schema DB)
      run: bun run db:run:stack --no-docker
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/skolr?schema=public

    - name: Install Playwright browser
      working-directory: packages/e2e
      run: bunx playwright install --with-deps chromium

    - name: Run E2E tests
      working-directory: packages/e2e
      run: bunx playwright test
      env:
        CI: 'true'
        GATEWAY_INTERNAL_URL: http://localhost:3001

    - name: Upload Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: packages/e2e/playwright-report
        retention-days: 7

    - name: Dump backend logs on failure
      if: failure()
      run: docker compose logs backend
