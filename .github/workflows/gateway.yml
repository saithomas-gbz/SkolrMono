name: Gateway CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'packages/gateway/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'packages/gateway/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Bun
      run: curl -fsSL https://bun.sh/install | bash

    - name: Add Bun to PATH
      run: echo "$HOME/.bun/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: bun install

    - name: Build gateway
      working-directory: packages/gateway
      run: bun run build

    # - name: Test gateway
    #   working-directory: packages/gateway
    #   run: bun test
