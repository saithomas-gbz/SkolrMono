name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'packages/frontend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'packages/frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install

    - name: Build frontend
      working-directory: packages/frontend
      run: bun run build

    - name: Test frontend
      working-directory: packages/frontend
      run: bun run test

    - name: Test coverage
      working-directory: packages/frontend
      run: bun run test:coverage