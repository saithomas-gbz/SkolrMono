services:
  postgres:
    image: postgres:15-alpine
    container_name: skolr_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skolr_auth
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skolr_network
  postgres-class:
    image: postgres:15-alpine
    container_name: skolr_class_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skolr_class
    ports:
      - "5433:5432"
    volumes:
      - postgres_class_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - "skolr_network"
  postgres-grade:
    image: postgres:15-alpine
    container_name: skolr_grade_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skolr_grade
    ports:
      - "5434:5432"
    volumes:
      - postgres_grade_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skolr_network
  auth-service:
    build:
      context: .
      dockerfile: ./packages/auth-service/Dockerfile
    container_name: skolr_auth_service
    environment:
        - NODE_PATH=/app/node_modules
        - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/skolr_auth?schema=public
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - skolr_network
  class-service:
    build:
      context: .
      dockerfile: ./packages/class-service/Dockerfile
    container_name: skolr_class_service
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-class:5432/skolr_class?schema=public
    depends_on:
      postgres-class:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - skolr_network
  grade-service:
    build:
      context: .
      dockerfile: ./packages/grade-service/Dockerfile
    container_name: skolr_grade_service
    environment:
      - PORT=3007
      - DATABASE_URL=postgresql://postgres:postgres@postgres-grade:5432/skolr_grade?schema=public
    ports:
      - "3007:3007"
    depends_on:
      postgres-grade:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3007/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - skolr_network
  gateway:
    build:
      context: ./packages/gateway
      dockerfile: Dockerfile
    container_name: skolr_gateway
    environment:
      - PORT=3001
      - AUTH_SERVICE_URL=http://auth-service:3000
      - CLASS_SERVICE_URL=http://class-service:3002
      - GRADE_SERVICE_URL=http://grade-service:3007
    ports:
      - "3001:3001"
    depends_on:
      auth-service:
        condition: service_healthy
      class-service:
        condition: service_healthy
      grade-service:
        condition: service_healthy
    networks:
      - skolr_network

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      target: dev
    container_name: skolr_frontend
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NUXT_PUBLIC_GATEWAY_BASE_URL=/api
      - GATEWAY_INTERNAL_URL=http://gateway:3001
    command: bun run dev --host 0.0.0.0 --port 3003
    ports:
      - "3003:3003"
    depends_on:
      - gateway
    networks:
      - skolr_network
volumes:
  postgres_auth_data:
  postgres_class_data:
  postgres_grade_data:

networks:
  skolr_network:
    driver: bridge
