services:
  postgres:
    image: postgres:18-alpine
    container_name: skolr_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-skolr}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - skolr_network
  backend:
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile
    container_name: skolr_backend
    environment:
      - PORT=${BACKEND_PORT:-3001}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-skolr}?schema=public
      - JWT_SECRET=${JWT_SECRET:-your_secure_jwt_secret_here}
      # --- OAuth Google (auth) ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URI=${GOOGLE_CALLBACK_URI:-http://localhost:3001/auth/login/google/callback}
      - GOOGLE_OAUTH_SUCCESS_URL=${GOOGLE_OAUTH_SUCCESS_URL:-http://localhost:3003/auth/success}
      - GOOGLE_OAUTH_ERROR_URL=${GOOGLE_OAUTH_ERROR_URL:-http://localhost:3003/auth/error}
      # --- Email transactionnel (auth) ---
      - MAIL_PROVIDER=${MAIL_PROVIDER:-console}
      - MAIL_FROM=${MAIL_FROM:-no-reply@skolr.local}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - INVITATION_URL=${INVITATION_URL:-http://localhost:3003/auth/accept-invitation}
      - PASSWORD_RESET_URL=${PASSWORD_RESET_URL:-http://localhost:3003/auth/reset-password}
      # --- Stripe (billing) ---
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_STARTER=${STRIPE_PRICE_STARTER:-}
      - STRIPE_PRICE_STANDARD=${STRIPE_PRICE_STANDARD:-}
      - STRIPE_PRICE_PREMIUM=${STRIPE_PRICE_PREMIUM:-}
      - STRIPE_SUCCESS_URL=${STRIPE_SUCCESS_URL:-http://localhost:3003/admin/billing?success=1}
      - STRIPE_CANCEL_URL=${STRIPE_CANCEL_URL:-http://localhost:3003/admin/billing?canceled=1}
      # --- Stockage des pièces jointes (message → S3/MinIO, planning → disque) ---
      - STORAGE_BACKEND=${STORAGE_BACKEND:-s3}
      - MESSAGE_MAX_FILE_SIZE_BYTES=${MESSAGE_MAX_FILE_SIZE_BYTES:-5242880}
      - MESSAGE_ALLOWED_MIME_TYPES=${MESSAGE_ALLOWED_MIME_TYPES:-application/pdf,image/jpeg,image/png,image/gif,image/webp}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-skolr-messages}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin}
      - UPLOADS_DIR=${UPLOADS_DIR:-/app/packages/backend/uploads}
      # --- Observabilité ---
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      # Métriques Prometheus sur un port dédié, volontairement absent de `ports:`
      # ci-dessous : joignable depuis le réseau Docker (Prometheus), jamais
      # depuis l'hôte. `0.0.0.0` est nécessaire pour traverser le namespace
      # réseau du conteneur ; le défaut du code reste `127.0.0.1` (#218).
      - METRICS_ENABLED=${METRICS_ENABLED:-true}
      - METRICS_HOST=0.0.0.0
      - METRICS_PORT=${METRICS_PORT:-9464}
    ports:
      - "${BACKEND_PORT:-3001}:${BACKEND_PORT:-3001}"
    volumes:
      # Bind mount (pas un volume nommé) : scripts/db/seed-pipeline.ts écrit les
      # documents planning depuis l'hôte (bun run seed:dev) — il doit voir le même
      # répertoire que le conteneur.
      - ./packages/backend/uploads:/app/packages/backend/uploads
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:${BACKEND_PORT:-3001}/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - skolr_network
      # Prometheus vit sur `monitoring` : sans ce second rattachement, il ne
      # peut pas résoudre `backend` pour scruter ses métriques (#218).
      - monitoring
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      target: dev
    container_name: skolr_frontend
    volumes:
      - ./packages/frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NUXT_PUBLIC_GATEWAY_BASE_URL=${NUXT_PUBLIC_GATEWAY_BASE_URL:-/api}
      - NUXT_PUBLIC_GATEWAY_WS_BASE_URL=${NUXT_PUBLIC_GATEWAY_WS_BASE_URL:-ws://localhost:${BACKEND_PORT:-3001}}
      - NUXT_PUBLIC_GATEWAY_DIRECT_URL=${NUXT_PUBLIC_GATEWAY_DIRECT_URL:-http://localhost:${BACKEND_PORT:-3001}}
      - GATEWAY_INTERNAL_URL=${GATEWAY_INTERNAL_URL:-http://backend:3001}
      - NUXT_PUBLIC_SENTRY_DSN=${NUXT_PUBLIC_SENTRY_DSN:-}
      - NUXT_PUBLIC_SENTRY_ENVIRONMENT=${SENTRY_ENVIRONMENT:-production}
      - SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN:-}
      - SENTRY_ORG=${SENTRY_ORG:-}
      - SENTRY_PROJECT=${SENTRY_PROJECT:-frontend}
    command: bun run dev --host 0.0.0.0 --port ${FRONTEND_PORT:-3003}
    ports:
      - "${FRONTEND_PORT:-3003}:${FRONTEND_PORT:-3003}"
    depends_on:
      - backend
    networks:
      - skolr_network
  grafana:
    image: grafana/grafana:13.1.3
    container_name: skolr_grafana
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - skolr_network
      - monitoring
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # `rule_files` de prometheus.yml pointe dessus : sans ce montage,
      # Prometheus refuse de démarrer (#218).
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - monitoring
    restart: unless-stopped
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitoring
    restart: unless-stopped
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres_exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-skolr}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skolr_network
      - monitoring
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - skolr_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
  minio_data:

networks:
  skolr_network:
    name: skolr_network
    driver: bridge
  monitoring:
    name: skolr_monitoring
    driver: bridge
